<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Logo Oficial do Instagram | Açaí na Garrafa</title>
  <style>
    body {
      background: #0f0212;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 30px;
    }
    h1 {
      margin-bottom: 6px;
      font-size: 2rem;
      text-align: center;
    }
    p {
      color: #b8a5be;
      margin-bottom: 30px;
      text-align: center;
    }
    .preview-container {
      display: flex;
      gap: 40px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: #1e0722;
      border: 1px solid #441a4e;
      border-radius: 24px;
      padding: 26px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      width: 330px;
    }
    .card h3 {
      font-size: 1.15rem;
      margin-bottom: 16px;
      color: #00e599;
    }
    .instagram-circle {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #d62976;
      box-shadow: 0 0 25px rgba(214, 41, 118, 0.5);
      margin: 0 auto 16px;
      background: #000;
    }
    .instagram-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .square-preview {
      width: 260px;
      height: 260px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid #00e599;
      margin: 0 auto 16px;
      box-shadow: 0 8px 25px rgba(0, 229, 153, 0.2);
    }
    .square-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .btn-download {
      background: #00e599;
      color: #042517;
      text-decoration: none;
      font-weight: 800;
      padding: 12px 24px;
      border-radius: 30px;
      display: inline-block;
      margin-top: 10px;
      transition: all 0.2s;
    }
    .btn-download:hover {
      background: #33ffb5;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>🍇 Logo Marca Oficial para o Instagram</h1>
  <p>Criada com estética premium: Roxo Açaí Profundo, Verde Esmeralda Neon e garrafa estilizada.</p>

  <div class="preview-container">
    <!-- Visualização no Corte Circular do Instagram -->
    <div class="card">
      <h3>📱 Como vai aparecer no seu Perfil</h3>
      <div class="instagram-circle">
        <img src="logo-instagram.jpg" alt="Logo Instagram Circular">
      </div>
      <span style="font-size: 0.85rem; color: #aaa;">Enquadramento perfeito no círculo do avatar!</span>
    </div>

    <!-- Arquivo Original Pronto para Upload -->
    <div class="card">
      <h3>🖼️ Imagem Original (Alta Resolução)</h3>
      <div class="square-preview">
        <img src="logo-instagram.jpg" alt="Logo Instagram Quadrada">
      </div>
      <a href="logo-instagram.jpg" download="logo-acai-na-garrafa.jpg" class="btn-download">⬇️ Baixar Imagem para o Celular</a>
    </div>
  </div>
</body>
</html>
