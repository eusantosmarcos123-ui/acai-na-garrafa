<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo Premium -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3d0a42" />
      <stop offset="60%" stop-color="#19031c" />
      <stop offset="100%" stop-color="#0b010c" />
    </radialGradient>

    <!-- Gradiente Roxo Açaí Líquido -->
    <linearGradient id="acaiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#691270" />
      <stop offset="50%" stop-color="#3b053f" />
      <stop offset="100%" stop-color="#1f0221" />
    </linearGradient>

    <!-- Gradiente Verde Neon Fresh -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#00B87A" />
    </linearGradient>

    <!-- Gradiente Dourado / Brilho Gelado -->
    <linearGradient id="frostGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Sombra Neon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Fundo Circular Perfeito para o Avatar do Instagram -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Anel de Destaque Externo Minimalista (Glow Neon) -->
  <circle cx="400" cy="400" r="370" fill="none" stroke="url(#neonGreen)" stroke-width="4" opacity="0.35" stroke-dasharray="8 12" />
  <circle cx="400" cy="400" r="360" fill="none" stroke="#6C1D72" stroke-width="2" opacity="0.5" />

  <!-- Base da Garrafa com Sombra -->
  <g filter="url(#softShadow)">
    
    <!-- Halo Luminoso Atrás do Símbolo -->
    <circle cx="400" cy="355" r="145" fill="#4A0E4E" opacity="0.5" filter="url(#glow)" />
    
    <!-- Tampa da Garrafa Estilizada -->
    <rect x="365" y="165" width="70" height="24" rx="7" fill="url(#neonGreen)" />
    <!-- Gargalo da Garrafa -->
    <path d="M375,189 L425,189 L428,230 C428,245 448,260 465,278 L465,475 C465,510 440,530 400,530 C360,530 335,510 335,475 L335,278 C352,260 372,245 372,230 Z" 
          fill="url(#acaiGrad)" stroke="#6C1D72" stroke-width="4" />

    <!-- Brilho Lateral de Vidro Gelado -->
    <path d="M346,285 C340,310 340,460 346,485 C350,470 350,300 346,285 Z" fill="#FFFFFF" opacity="0.3" />

    <!-- Líquido Açaí Ondulante Interno com Destaque -->
    <path d="M340,340 Q370,360 400,340 T460,340 L460,475 C460,505 440,522 400,522 C360,522 340,505 340,475 Z" fill="#240228" />

    <!-- Folha Natural de Açaí / Broto Amazônico (Símbolo de Pureza) -->
    <path d="M400,335 C425,305 465,305 470,335 C470,365 435,385 400,385 C395,385 398,350 400,335 Z" 
          fill="url(#neonGreen)" filter="url(#glow)" opacity="0.95" />
    <path d="M400,385 C375,360 370,335 390,320" fill="none" stroke="#04321c" stroke-width="3" stroke-linecap="round" />

    <!-- Gotas de Condensação Gelada -->
    <circle cx="370" cy="420" r="5" fill="#00FFA3" opacity="0.8" />
    <circle cx="430" cy="445" r="4" fill="#00FFA3" opacity="0.7" />
    <circle cx="418" cy="405" r="6" fill="#FFFFFF" opacity="0.85" />
    <circle cx="365" cy="460" r="3.5" fill="#FFFFFF" opacity="0.6" />

    <!-- Ícone de Floco de Neve / Pureza Gelada no Centro -->
    <g transform="translate(400, 440) scale(0.65)" stroke="url(#neonGreen)" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-25" x2="0" y2="25" />
      <line x1="-25" y1="0" x2="25" y2="0" />
      <line x1="-18" y1="-18" x2="18" y2="18" />
      <line x1="-18" y1="18" x2="18" y2="-18" />
    </g>
  </g>

  <!-- Tipografia de Marca Premium (Clean & Bold) -->
  <g text-anchor="middle">
    <!-- Texto Principal -->
    <text x="400" y="605" font-family="'Outfit', 'Montserrat', 'Helvetica', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="4">
      AÇAÍ NA GARRAFA
    </text>

    <!-- Subtítulo / Proposta de Valor -->
    <text x="400" y="642" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="url(#neonGreen)" letter-spacing="7">
      • 100% PURO &amp; GELADO •
    </text>

    <!-- Mini Selo D2C -->
    <rect x="325" y="668" width="150" height="26" rx="13" fill="#200624" stroke="#4A0E4E" stroke-width="1.5" />
    <text x="400" y="686" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#df9eff" letter-spacing="3">
      ARTESANAL D2C
    </text>
  </g>
</svg>
