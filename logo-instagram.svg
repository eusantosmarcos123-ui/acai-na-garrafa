<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Fundo Preto Fosco Profundo -->
    <radialGradient id="luxBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#18041d" />
      <stop offset="60%" stop-color="#0a010d" />
      <stop offset="100%" stop-color="#030004" />
    </radialGradient>

    <!-- Gradiente Verde Esmeralda Neon Suave -->
    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#00C47E" />
    </linearGradient>

    <!-- Gradiente Prata / Titânio Escovado -->
    <linearGradient id="silverGloss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#555566" />
      <stop offset="35%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#888899" />
      <stop offset="100%" stop-color="#444455" />
    </linearGradient>

    <!-- Roxo Açaí Profundo -->
    <linearGradient id="purpleRoyal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A0B52" />
      <stop offset="100%" stop-color="#240228" />
    </linearGradient>

    <!-- Glow Suave de Estúdio -->
    <filter id="studioGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Fundo 1:1 Quadrado com recorte limpo -->
  <rect width="1000" height="1000" fill="url(#luxBg)" />

  <!-- Borda Circular Sutil de Precisão Geométrica -->
  <circle cx="500" cy="500" r="455" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="2" />
  <circle cx="500" cy="500" r="445" fill="none" stroke="url(#emeraldNeon)" stroke-width="1.5" opacity="0.35" stroke-dasharray="6 14" />

  <!-- Halo de Luz Traseiro Atmosférico -->
  <circle cx="500" cy="420" r="180" fill="#38063f" opacity="0.45" filter="url(#studioGlow)" />

  <!-- EMBLEMA CENTRAL MINIMALISTA (A SILHUETA DE PRECISÃO DA GARRAFA & GOTA) -->
  <g filter="url(#softDrop)">

    <!-- Tampa de Alumínio Escovado Minimalista -->
    <rect x="462" y="200" width="76" height="26" rx="6" fill="url(#silverGloss)" />
    <rect x="474" y="226" width="52" height="18" fill="#1f1f26" />

    <!-- O Corpo da Garrafa Escultural -->
    <!-- Curvatura Nórdica Minimalista: ombros largos, afunilando com elegância -->
    <path d="M472,244 L528,244 C534,244 538,248 540,254 C554,290 590,320 615,355 C635,385 640,430 640,480 L640,620 C640,660 610,690 570,690 L430,690 C390,690 360,660 360,620 L360,480 C360,430 365,385 385,355 C410,320 446,290 460,254 C462,248 466,244 472,244 Z" 
          fill="url(#purpleRoyal)" 
          stroke="rgba(255, 255, 255, 0.15)" 
          stroke-width="2" />

    <!-- Reflexo de Vidro Lateral Ultrafino -->
    <path d="M380,365 C372,400 372,600 380,635 C385,615 386,390 380,365 Z" fill="#FFFFFF" opacity="0.22" />

    <!-- GOTA BOTÂNICA CENTRAL EM VERDE ESMERALDA NEON (PUREZA E ENERGIA DA FRUTA) -->
    <!-- Símbolo icônico gravado no centro do frasco -->
    <g transform="translate(500, 480)">
      <!-- Gota externa geométrica -->
      <path d="M0,-95 C55,-35 85,15 85,70 C85,120 47,155 0,155 C-47,155 -85,120 -85,70 C-85,15 -55,-35 0,-95 Z" 
            fill="url(#emeraldNeon)" 
            filter="url(#studioGlow)" 
            opacity="0.9" />

      <!-- Recorte orgânico interno negativo (Folha / Espírito do Açaí) -->
      <path d="M0,-50 C28,-15 45,15 45,45 C45,75 25,95 0,95 C-25,95 -45,75 -45,45 C-45,15 -28,-15 0,-50 Z" 
            fill="#18041d" />

      <!-- Nervura de precisão -->
      <path d="M0,-35 L0,70" stroke="url(#emeraldNeon)" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- Floco / Micro-Estrela de Frescor Gelado -->
    <circle cx="590" cy="580" r="3" fill="#FFFFFF" opacity="0.8" />
    <circle cx="410" cy="560" r="2.5" fill="#00FFA3" opacity="0.7" />
    <circle cx="425" cy="400" r="3" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- LOGOTIPO EM TIPOGRAFIA GEOMÉTRICA DE LUXO -->
  <!-- Espaçamento nobre (tracking amplo) estilo marcas suecas / americanas premium -->
  <g text-anchor="middle">
    <!-- Nome Principal -->
    <text x="500" y="785" 
          font-family="'Space Grotesk', 'Plus Jakarta Sans', -apple-system, sans-serif" 
          font-size="46" 
          font-weight="800" 
          fill="#FFFFFF" 
          letter-spacing="12">
      A Ç A Í
    </text>

    <!-- Sobrenome / Conceito da Garrafa -->
    <text x="500" y="830" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="20" 
          font-weight="700" 
          fill="url(#emeraldNeon)" 
          letter-spacing="14">
      NA GARRAFA
    </text>

    <!-- Selo de Pureza Funcional -->
    <text x="500" y="875" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="11" 
          font-weight="600" 
          fill="rgba(255, 255, 255, 0.4)" 
          letter-spacing="5">
      PURE CRAFT • COLD CHAIN • D2C
    </text>
  </g>
</svg>
